# Generated by slipway for app `web` (runner=github-actions, pr_checks=path-filtered). Regenerate with the scaffold; do not hand-edit.
# CI of ONE app. It runs when this app's inputs change (the `paths` below are rendered from .slipway/config.yaml and are the
# same list as the pathFilters in version.json). The stages live in _ci.yml. Deployment: taskflow-app-web-cd.yml.
name: taskflow-app-web-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!.slipway/**"
      - "!**/*.md"
      - "!**/.terraform.lock.hcl"
  push:
    branches: [main]
    paths:
      - "**"
      - "!.slipway/**"
      - "!**/*.md"
      - "!**/.terraform.lock.hcl"
  workflow_dispatch:

concurrency:
  group: taskflow-app-web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # the release job creates the tag web/v<version> on main
  id-token: write   # OIDC token for azure/login (no stored cloud credentials)
  pull-requests: read

jobs:

  test:
    # This app's tests, with its own service containers, before the shared stages build the image.
    name: web test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: install web dependencies
        run: npm ci --prefix "." --no-audit --no-fund
      - name: test web
        run: npm test

  ci:
    name: web
    needs: [test]
    uses: ./.github/workflows/_ci.yml
    with:
      app: web
      app_path: .
      context: .
      dockerfile: Dockerfile
      image_repository: taskflow-app/web
      is_dotnet: false
      is_node: true
      tag_prefix: web/v
    secrets: inherit

  result:
    # Always produces a check named `web ci`, whether the app was built or skipped: reusable-workflow jobs emit
    # no nested checks when the caller job is skipped, so a branch rule must require this check (and `web changes`).
    name: web ci
    needs: [test, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }} | ci: ${{ needs.ci.result }}"
          case "${{ needs.test.result }}" in failure|cancelled) echo "::error::web: tests ${{ needs.test.result }}"; exit 1;; esac
          case "${{ needs.ci.result }}" in
            success) echo "web: built and tested";;
            skipped) echo "web: untouched by this change, nothing to build";;
            *) echo "::error::web: CI ${{ needs.ci.result }}"; exit 1;;
          esac
