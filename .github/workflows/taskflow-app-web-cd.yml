# Generated by slipway for app `web` (runner=github-actions, cd_trigger=manual). Regenerate with the scaffold; do not hand-edit.
# CD of ONE app: deploy one immutable tag of `web` to one environment through the stages in _cd.yml (plan, human approval, apply, smoke).
# Started on demand with `/slipway:deploy web <tag> <env>` (workflow_dispatch).
name: taskflow-app-web-cd

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag of web from taskflow-app-web-ci (semver, e.g. 0.1.3)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev

concurrency:
  group: taskflow-app-web-cd-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write  # attach deploy outputs and smoke test to the GitHub Release of the tag
  actions: read   # read the release manifest artifact of the CI run

jobs:
  resolve:
    name: web resolve
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      environment: ${{ steps.r.outputs.environment }}
    steps:
      - id: r
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            [ -f manifest/release-manifest.json ] || { echo "::error::CI run ${{ github.event.workflow_run.id }} published no release manifest for web (no release job on that run); nothing to deploy"; exit 1; }
            TAG=$(python3 -c 'import json; print(json.load(open("manifest/release-manifest.json"))["version"])')
            ENV="dev"
          else
            TAG="${{ inputs.tag }}"; ENV="${{ inputs.environment }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "### web $TAG → $ENV (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  cd:
    name: web
    needs: resolve
    uses: ./.github/workflows/_cd.yml
    with:
      app: web
      tag: ${{ needs.resolve.outputs.tag }}
      environment: ${{ needs.resolve.outputs.environment }}
      infra_dir: infra/apps/web
      tag_prefix: web/v
      image_repository: taskflow-app/web
    secrets: inherit
